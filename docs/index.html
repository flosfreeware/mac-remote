<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Mac Remote turns your iPhone into a simple remote for your Mac.">
    <title>Mac Remote</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #0a0a0b; color: #f5f5f7; display: grid; place-items: center; }
      main { width: min(100% - 40px, 620px); padding: 64px 0 40px; text-align: center; }
      .icon { width: 76px; height: 76px; margin: 0 auto 24px; border-radius: 19px; display: grid; place-items: center; background: linear-gradient(145deg, #4f9cff, #0864da); box-shadow: 0 14px 35px #0066dd55; font-size: 37px; }
      h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 4.25rem); letter-spacing: -0.065em; }
      .intro { margin: 18px auto 32px; max-width: 460px; color: #a1a1a6; font-size: 1.15rem; line-height: 1.5; }
      .download { display: inline-block; padding: 14px 22px; border-radius: 999px; background: #0a84ff; color: white; font-weight: 650; text-decoration: none; transition: transform .15s ease, background .15s ease; }
      .download:hover { background: #2997ff; transform: scale(1.02); }
      .note { margin: 16px 0 0; color: #86868b; font-size: .9rem; }
      footer { margin-top: 72px; font-size: .85rem; color: #86868b; }
      footer a { color: #b4d6ff; text-decoration: none; }
      footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">⌁</div>
      <h1>Mac Remote</h1>
      <p class="intro">Use your iPhone as a simple, responsive remote for your Mac.</p>
      <a class="download" href="https://covyy.github.io/mac-remote-site/downloads/Mac-Remote.pkg">Download for macOS</a>
      <p class="note">The iPhone app is available on the App Store.</p>
      <footer>
        <a href="privacy.html">Privacy Policy</a>
      </footer>
    </main>
  </body>
</html>
